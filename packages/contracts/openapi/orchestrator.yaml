openapi: 3.0.3
info:
  title: Full Shelf ADK Orchestrator API
  version: 1.4.1
  description: Read-only orchestration, managed event ingress, and durable projections.
paths:
  /:
    get:
      summary: Sole externally reachable public health endpoint
      description: >-
        The public Cloud Run boundary serves this application health response
        without authentication. This is the only externally reachable public
        health endpoint accepted for Full Shelf.
      security: []
      responses:
        '200': { description: Public orchestrator health response }
  /healthz:
    get:
      summary: Application-classified health route intercepted at the public boundary
      description: >-
        The exhaustive application route-authentication matrix retains this
        public-health classification. At the deployed public Cloud Run boundary,
        however, the request is intercepted before the container and receives a
        Google-generated HTTP 404. The 404 is an accepted platform-boundary
        observation, not an observed-live application health capability.
      security: []
      responses:
        '404': { description: Google-generated Cloud Run platform-boundary response }
  /api/v1/orchestrator/approvals/approve-and-activate:
    post:
      summary: Verify one human GIS token and forward its original assertion to the private ledger
      security: [{ googleHumanOperatorOidc: [] }]
      responses:
        '200': { description: Independently verified, KMS-bound approval and activation receipts }
        '401': { description: Missing, forged, expired, or wrong-audience human token }
        '403': { description: Valid Google identity is not the allowlisted operator }
        '502': { description: Private ledger approval failed closed }
  /api/v1/orchestrator/daily-plan/generate:
    post:
      summary: Create or replay one ordinary operating-day rev07
      description: >-
        Product identity is the logical tenant, ISO operating day,
        PLAN_DAY_REQUESTED type, plan ID, and rev07. Managed delivery IDs do
        not create authority. The same request returns the existing receipt.
      security: [{ googleInternalWorkloadOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/operating_day_request.json' }
      responses:
        '200': { description: Created or idempotently replayed rev07 and receipt }
        '403': { description: Workload identity or operating-day authority rejected }
        '409': { description: Stable key reused for different mutation semantics }
        '502': { description: Private ledger commit failed }
  /api/v1/orchestrator/pubsub/push:
    post:
      summary: Receive an OIDC-authenticated managed Pub/Sub delivery
      description: >-
        Accepts PLAN_DAY_REQUESTED as a date-free RecurringDailyRequest,
        PLAN_NEXT_DAY_REQUESTED, or
        RECALL_NOTICE_RECEIVED. Recall notices pass managed Model Armor before
        ADK/Gemini or any recall ledger mutation. Duplicate deliveries resolve
        to stable command receipts. After managed OIDC verification, daily
        operating_day is derived only from Pub/Sub message.publishTime in the
        configured food-bank timezone. The resulting ledger request is keyed by
        logical tenant, derived ISO day, request type, plan ID, and revision;
        raw timestamps and delivery identity are excluded. Next-day product
        identity is tenant, trusted source operating day, event type, next-day
        plan ID, and revision. Authenticated permanently malformed, stale, or
        permanently rejected messages are acknowledged with 2xx and zero mutations;
        transient managed or authoritative failures remain retryable.
      security: [{ googleManagedOidc: [] }]
      responses:
        '200': { description: Committed, idempotently replayed, stale-acknowledged, or permanently-rejected authenticated event }
        '401': { description: Missing, invalid, expired, or wrong-audience token }
        '403': { description: Valid but unauthorized managed identity or tenant }
        '503': { description: Retryable managed, ledger, or authoritative failure }
  /api/v1/orchestrator/partner-evidence:
    post:
      summary: Process one authenticated partner custody evidence event
      description: >-
        The exact Google callback principal determines tenant and partner.
        Model Armor screens the original response before a real ADK Runner
        proposes claims. Only deterministic ledger policy can confirm custody.
      security: [{ googlePartnerCallbackOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/partner_evidence_request.json' }
      responses:
        '200': { description: Committed APPLIED or DENIED evidence and its sole receipt }
        '401': { description: Missing, invalid, expired, or wrong-audience Google token }
        '403': { description: Valid identity is not the configured partner callback }
        '409': { description: Source-event collision or authoritative precondition failure }
        '503': { description: Model Armor, ADK, or authoritative read failed closed }
  /api/v1/incidents/site01-deadline:
    post:
      summary: Receive an OIDC-authenticated Cloud Tasks acknowledgment deadline
      security: [{ googleManagedOidc: [] }]
      responses:
        '200': { description: Stable ledger-committed acknowledgment-hold receipt }
        '400': { description: Task headers and scoped payload do not match }
        '401': { description: Missing, invalid, expired, or wrong-audience token }
        '403': { description: Valid but unauthorized managed identity or tenant }
  /api/v1/orchestrator/recall/trigger:
    post:
      summary: Publish one scoped recall event for managed Pub/Sub delivery
      security: [{ googleInternalWorkloadOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecallTrigger' }
      responses:
        '200': { description: Pub/Sub message ID; not evidence of downstream execution }
        '403': { description: Workload identity or tenant rejected }
  /api/v1/orchestrator/recall/execute-hero-loop:
    post:
      deprecated: true
      summary: Retired direct mutation path
      responses:
        '410': { description: Use managed recall trigger }
  /api/v1/orchestrator/recall/model-armor-preflight:
    post:
      summary: Exercise only the managed sanitizeUserPrompt boundary
      security: [{ googleInternalWorkloadOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Notice' }
      responses:
        '200': { description: Managed allow, block, or fail-closed result with zero downstream mutation }
  /api/v1/orchestrator/recall/extraction-preflight:
    post:
      summary: Exercise managed Model Armor then ADK/Gemini without mutation
      security: [{ googleInternalWorkloadOidc: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Notice' }
      responses:
        '200': { description: Correlated extraction or fail-closed/manual-review result }
  /api/v1/orchestrator/custody/graph:
    get:
      summary: Execute parameterized variable-depth Spanner Graph custody traversal
      security: [{ googleInternalWorkloadOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: lot_id
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: Managed GQL result with confirmed and unconfirmed totals }
        '404': { description: No custody paths found }
        '503': { description: Managed graph read failed closed }
  /api/v1/orchestrator/site01-escalation/schedule:
    post:
      summary: Validate authoritative hold state and create one deterministic Cloud Task
      security: [{ googleInternalWorkloadOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Managed task name and bound OIDC delivery configuration }
        '409': { description: Recall or acknowledgment-hold precondition failed }
  /api/v1/projections/stream:
    get:
      summary: Live-tail committed receipts with durable Last-Event-ID resume
      security: [{ googleHumanOperatorOidc: [] }]
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { type: string }
      responses:
        '200': { description: text/event-stream projection updates and heartbeats }
        '400': { description: Invalid receipt cursor }
        '401': { description: Verified frontend Google identity required }
        '503': { description: Deployment-bound frontend tenant/day unavailable }
  /api/v1/projections/demo-beats:
    get:
      summary: Project committed state for the deployment-bound frontend tenant/day
      description: >-
        Projects only facts committed at or before an explicit boundary.
        With no as_of, a request for the CURRENT authority operating day uses
        trusted server time (projection_boundary.mode = LIVE_SERVER_TIME). A
        historical or replay operating day has no trustworthy implicit
        boundary, so an explicit as_of is REQUIRED and its absence is rejected
        with EXPLICIT_AS_OF_REQUIRED_FOR_NON_CURRENT_OPERATING_DAY. An as_of
        outside the authority operating day is rejected, never silently
        narrowed. next_day_draft is omitted entirely unless
        include_next_day_draft=true, and even then appears only when a next-day
        revision committed at or before the boundary.


        Evidence appears only after it exists. current_day.approvals carries
        the verified approval, its immutable rev07->rev08 plan_diff, and the
        stored kms_key_version, and is empty until an approval was verified at
        or before the boundary; the KMS signature value is never projected.
        agent_activity_as_of.agents lists all five accepted agents projected
        from persisted fleet evidence only, each COMPLETED, NOT_YET_REPORTED,
        or NOT_INVOLVED. The synchronous runtime records no Running or Waiting
        state, no durations, and no per-hop timing, so the contract cannot
        express them. Model Armor is an input-screening boundary and is not a
        member of that list. current_day.dispatch exposes committed
        order-to-vehicle assignments, stops, and capacity arithmetic, and
        contains no coordinate, position, bearing, or route geometry.
        execution_evidence_as_of.history is a bounded, tenant-scoped receipt
        sequence at or before the boundary and never contains a post-boundary
        event. Its relevance set is built from recomputed command identities
        for the selected plan and incidents, never from action type, receipt
        position, or substring matching, and relevance is applied before the
        output cap.


        Every block is scoped to its exact target, not merely to the tenant and
        day: approvals bind to the selected plan_id and the intended revision
        transition, recovery and work items bind to the selected incidents
        through their authoritative incident_id, and current_day.plan_constraints
        binds to the current-day plan_id so a next-day constraint committed
        earlier in the day cannot appear. current_day.dispatch.partner_pickups
        carries approved commitments that have no assigned vehicle; a null
        vehicle id is the partner-pickup path and is retained as evidence rather
        than dropped.
      security: [{ googleHumanOperatorOidc: [] }]
      parameters:
        - in: query
          name: as_of
          required: false
          description: >-
            Explicit ISO-8601 boundary instant. A trailing Z is accepted; a
            naive value is interpreted as UTC. Must fall within the authority
            operating day. Omit only for the current operating day.
          schema: { type: string, maxLength: 40 }
        - in: query
          name: include_next_day_draft
          required: false
          description: Include the optional next_day_draft block. Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authority-bound committed plan, approval, and incident facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoundedOperatorProjection' }
        '400':
          description: >-
            INVALID_AS_OF (as_of is not a parseable ISO-8601 instant);
            AS_OF_OUTSIDE_AUTHORITY_OPERATING_DAY (as_of resolves to a
            different day than the authority operating day);
            EXPLICIT_AS_OF_REQUIRED_FOR_NON_CURRENT_OPERATING_DAY (as_of was
            omitted for a non-current operating day).
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: string
                    enum:
                      - INVALID_AS_OF
                      - AS_OF_OUTSIDE_AUTHORITY_OPERATING_DAY
                      - EXPLICIT_AS_OF_REQUIRED_FOR_NON_CURRENT_OPERATING_DAY
        '401': { description: Verified frontend Google identity required }
        '503': { description: Deployment-bound frontend tenant/day unavailable }
  /api/v1/evidence/system:
    get:
      summary: Read classified evidence for an explicitly resolved authority scope
      security: [{ googleInternalWorkloadOidc: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Evidence claims remain classified per source and execution }
components:
  parameters:
    TenantId:
      in: query
      name: tenant_id
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    BoundedOperatorProjection:
      $ref: '../schemas/ui_projection.json'
    RecallTrigger:
      type: object
      additionalProperties: false
      required: [coordinator_id, incident_id, lot_id, notice_text]
      properties:
        coordinator_id: { type: string, minLength: 1, maxLength: 64 }
        incident_id: { type: string, minLength: 1, maxLength: 64 }
        lot_id: { type: string, minLength: 1, maxLength: 64 }
        notice_text: { type: string, minLength: 1, maxLength: 20000 }
    Notice:
      type: object
      additionalProperties: false
      required: [notice_text]
      properties:
        notice_text: { type: string, minLength: 1, maxLength: 20000 }
  securitySchemes:
    googleManagedOidc:
      type: http
      scheme: bearer
      bearerFormat: Google ID token
    googlePartnerCallbackOidc:
      type: http
      scheme: bearer
      bearerFormat: Google-signed partner callback ID token for the exact audience
    googleHumanOperatorOidc:
      type: http
      scheme: bearer
      bearerFormat: Google-signed GIS ID token for the configured OAuth web client
    googleInternalWorkloadOidc:
      type: http
      scheme: bearer
      bearerFormat: Google-signed workload ID token for the exact service audience
