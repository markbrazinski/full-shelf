openapi: 3.0.3
info:
  title: Full Shelf ADK Orchestrator API
  version: 1.3.0
  description: ADK Gemini agent orchestrator service (Read-Only agent reasoning).
paths:
  /api/v1/orchestrator/pubsub/push:
    post:
      summary: Receive a Google OIDC-authenticated Pub/Sub push delivery
      description: >-
        Requires an exact-audience Google ID token from the configured managed
        delivery service account. Planning events are persisted and applied
        only through authenticated ledger commands.
      security: [{ googleManagedOidc: [] }]
      responses:
        '200': { description: Accepted or idempotently replayed managed event }
        '401': { description: Missing, invalid, expired, or wrong-audience token }
        '403': { description: Valid but unauthorized identity or tenant }
  /api/v1/incidents/site01-deadline:
    post:
      summary: Receive a Google OIDC-authenticated Cloud Tasks delivery
      security: [{ googleManagedOidc: [] }]
      responses:
        '200': { description: Ledger-committed acknowledgment escalation receipt }
        '401': { description: Missing, invalid, expired, or wrong-audience token }
        '403': { description: Valid but unauthorized identity or scope }
  /api/v1/orchestrator/site01-escalation/schedule:
    post:
      summary: Make the Site 01 escalation decision and create a real Cloud Task
      parameters:
        - in: header
          name: X-Full-Shelf-API-Key
          required: true
          schema: { type: string }
      responses:
        '200': { description: Managed task name and OIDC delivery configuration }
  /api/v1/orchestrator/recall/extraction-preflight:
    post:
      summary: Exercise the managed Model Armor to Google ADK extraction boundary
      description: >-
        Judge-protected, read-only WP5 proof surface. A successful structured
        extraction stops at deterministic policy review and performs no ledger
        mutation. Invalid output or managed invocation failure requires manual
        review.
      parameters:
        - in: header
          name: X-Full-Shelf-API-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notice_text]
              properties:
                notice_text:
                  type: string
                  minLength: 1
                  maxLength: 20000
      responses:
        '200':
          description: Correlated extraction result or fail-closed manual-review state
          content:
            application/json:
              schema:
                type: object
                required:
                  - preflight_status
                  - request_correlation_id
                  - ledger_mutation_attempted
                properties:
                  preflight_status:
                    enum:
                      - READY_FOR_POLICY_REVIEW
                      - MANUAL_REVIEW_REQUIRED
                      - HALTED_BY_MODEL_ARMOR
                  request_correlation_id: { type: string }
                  identifiers_persisted_to:
                    type: string
                    enum: [CLOUD_LOGGING]
                  ledger_mutation_attempted:
                    type: boolean
                    enum: [false]
  /api/v1/orchestrator/preview:
    get:
      summary: Fetch agent-synthesized preview of the day
      responses:
        '200':
          description: Natural language & structured preview
  /api/v1/orchestrator/incident/assess:
    post:
      summary: Agent assessment of disruption event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type: { type: string }
                event_details: { type: object }
      responses:
        '200':
          description: Proposed recovery actions and reasoning
components:
  securitySchemes:
    googleManagedOidc:
      type: http
      scheme: bearer
      bearerFormat: Google ID token
